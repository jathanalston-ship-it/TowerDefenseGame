<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- ASSIMILATE — the infected cell. A dark organic membrane, a glowing viral nucleus,
       and assimilation tendrils; authored at 64 so the 16px tab render keeps a bold,
       high-contrast silhouette (docs/VISUAL_IDENTITY.md palette). -->
  <defs>
    <radialGradient id="halo" cx="50%" cy="46%" r="50%">
      <stop offset="0%" stop-color="#e24dff" stop-opacity="0.5"/>
      <stop offset="62%" stop-color="#e24dff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#e24dff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="body" cx="44%" cy="40%" r="72%">
      <stop offset="0%" stop-color="#1d2f42"/>
      <stop offset="62%" stop-color="#0e1a29"/>
      <stop offset="100%" stop-color="#070f18"/>
    </radialGradient>
    <radialGradient id="core" cx="40%" cy="36%" r="68%">
      <stop offset="0%" stop-color="#ffe2f7"/>
      <stop offset="26%" stop-color="#f06bff"/>
      <stop offset="68%" stop-color="#8b2fd6"/>
      <stop offset="100%" stop-color="#45156e"/>
    </radialGradient>
  </defs>

  <!-- viral halo bleeding past the membrane -->
  <circle cx="32" cy="32" r="31" fill="url(#halo)"/>

  <!-- assimilation tendrils — long + wide enough to survive the 16px tab render, irregular
       lengths so the rim reads alive, not gear-like -->
  <g fill="#e0314b">
    <path d="M32 0.6l3.4 10.4h-6.8z"/>
    <path d="M32 0.6l3.4 10.4h-6.8z" transform="rotate(52 32 32)" opacity="0.9"/>
    <path d="M32 2.6l2.9 8.6h-5.8z" transform="rotate(118 32 32)"/>
    <path d="M32 0.6l3.4 10.4h-6.8z" transform="rotate(176 32 32)" opacity="0.92"/>
    <path d="M32 2.6l2.9 8.6h-5.8z" transform="rotate(238 32 32)" opacity="0.9"/>
    <path d="M32 1.6l3.1 9.4h-6.2z" transform="rotate(296 32 32)"/>
  </g>

  <!-- the cell body — an irregular membrane, not a perfect circle -->
  <path d="M32 8.5C44.8 8 55.4 18 55.2 31.2 55 44.8 45.2 55.8 31.6 55.4 18.6 55 8.6 44.6 9 31.4 9.4 18.4 19.6 9 32 8.5Z"
    fill="url(#body)" stroke="#c33b63" stroke-width="3.4"/>
  <!-- membrane inner sheen -->
  <path d="M32 12.5c10.6-.4 19.2 7.9 19.4 18.7" fill="none" stroke="#e24dff" stroke-width="1.6" stroke-linecap="round" opacity="0.35"/>

  <!-- the nucleus — the thing inside, glowing -->
  <ellipse cx="27.5" cy="26.5" rx="12.5" ry="12" fill="url(#core)"/>
  <circle cx="23.5" cy="22" r="2.9" fill="#ffffff" opacity="0.78"/>

  <!-- organelles + a feeding vein -->
  <circle cx="41" cy="40.5" r="3.4" fill="#6c2fa8" opacity="0.9"/>
  <circle cx="45.5" cy="32.5" r="2.1" fill="#8b3fd0" opacity="0.75"/>
  <circle cx="33.5" cy="46" r="2.4" fill="#5a2a86" opacity="0.7"/>
  <path d="M36.5 33.5c3.6 2 6.8 5.6 8.2 10.4" fill="none" stroke="#e0314b" stroke-width="1.7" stroke-linecap="round" opacity="0.55"/>
</svg>
