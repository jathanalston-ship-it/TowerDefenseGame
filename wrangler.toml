# Cloudflare Pages configuration (used by `wrangler pages dev` locally and by
# CLI deploys; the git-integrated Pages build reads Build settings from the
# dashboard instead — keep the two in sync via docs/DEPLOYMENT.md).
name = "assimilate"
pages_build_output_dir = "dist"
compatibility_date = "2026-06-01"

# ── D1: the transactional store (purchases, fulfillments, cloud saves,
#    leaderboards, rate limits). Create it once:
#      npx wrangler d1 create assimilate-db
#    then paste the printed database_id below AND bind it in the Pages project
#    (Settings → Functions → D1 database bindings → variable name DB).
[[d1_databases]]
binding = "DB"
database_name = "assimilate-db"
database_id = "f01362d3-54a3-4a8a-ba20-e52872686d53"

# ── Plain (non-secret) runtime vars. Server secrets are NOT set here — use
#    `npm run setup-secrets` (wrangler pages secret put). Public VITE_ build
#    values live in .env.production.
[vars]
ENVIRONMENT = "production"

[env.preview.vars]
ENVIRONMENT = "preview"

# Local dev secrets live in .dev.vars (gitignored) — see .env.example for keys.
